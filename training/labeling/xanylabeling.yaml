# X-AnyLabeling settings for this project (read with --config by label.ps1; the user's global settings are not touched).
#
# Keys 1-4: point mode with the wheel label already chosen: press the key, click the wheel, next key.
# Key 5: rectangle around the whole robot.
# Wheel numbering, seen from above with the robot facing away (front = the gripper side):
#   wheel_1 front right, wheel_2 rear right, wheel_3 front left, wheel_4 rear left.
#   So wheel_1 + wheel_3 are the front pair, wheel_2 + wheel_4 the rear pair.
# Click the centre of the wheel (easier to hit the same way every time than its floor contact). All four centres are at
# the same height, so the robot's heading from them is exact on the floor map; for the position, the wheel radius is
# corrected in code. A wheel you cannot see: leave it out.

labels:
  - wheel_1
  - wheel_2
  - wheel_3
  - wheel_4
  - robot
sort_labels: false
validate_label: exact
auto_use_last_label: false
store_data: false

digit_shortcuts:
  1: {mode: point, label: wheel_1}
  2: {mode: point, label: wheel_2}
  3: {mode: point, label: wheel_3}
  4: {mode: point, label: wheel_4}
  5: {mode: rectangle, label: robot}
