[project]
name = "ei-human-tracking"
version = "0.1.0"
description = "Robot, ball and robot heading models (training/) and two-camera tracking of people, owner, robot and ball in room coordinates (tracking/)"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
    "scipy",
    "ultralytics",
    "torch",
    "torchvision",
    "lap",            # tracker (ByteTrack) dependency of ultralytics
    "insightface",    # face detection and recognition (owner recognition)
    "onnxruntime",    # runs the InsightFace models
    "pypylon",        # Basler camera driver (basler_record_video.py, live camera)
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]


[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
