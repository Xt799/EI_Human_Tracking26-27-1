[project]
name = "ei-human-tracking"
version = "0.1.0"
description = "Robot and ball detection (training/, inference/) and two-camera tracking of people, owner, robot and ball in room coordinates (tracking/)"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
    "scipy",
    "ultralytics",
    "torch",
    "torchvision",
    "lap",            # tracker (ByteTrack) dependency of ultralytics
    "insightface",    # face detection and recognition (owner recognition)
    "onnxruntime",    # runs the InsightFace models
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
